<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8FA3BF" />
      <stop offset="100%" stop-color="#3E4C66" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep obsidian base -->
  <rect width="64" height="64" rx="14" fill="#07090E" />

  <!-- 2x2 Multi-Screen Matrix -->
  <rect x="11" y="11" width="19" height="19" rx="2.5" fill="#101521" stroke="url(#frameGrad)" stroke-width="2" />
  <rect x="34" y="11" width="19" height="19" rx="2.5" fill="#101521" stroke="url(#frameGrad)" stroke-width="2" />
  <rect x="11" y="34" width="19" height="19" rx="2.5" fill="#101521" stroke="url(#frameGrad)" stroke-width="2" />
  <rect x="34" y="34" width="19" height="19" rx="2.5" fill="#101521" stroke="url(#frameGrad)" stroke-width="2" />

  <!-- Subtle dark channel cutout behind waveform -->
  <path
    d="M10 32H21L24.5 36.5L28 24.5L32 16.5L35.5 44.5L39 26.5L42.5 36L45.5 32H54"
    stroke="#07090E"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Electric Cyan Audio Waveform Pulse -->
  <path
    d="M10 32H21L24.5 36.5L28 24.5L32 16.5L35.5 44.5L39 26.5L42.5 36L45.5 32H54"
    stroke="#06E5F5"
    stroke-width="2.75"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#cyanGlow)"
  />
</svg>
